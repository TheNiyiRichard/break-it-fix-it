# Dependabot checks dependencies weekly and opens pull requests, which CI tests.
# Policy for this project:
# - Patch and minor updates are grouped into ONE pull request per ecosystem per week.
# - Major version upgrades are skipped here and done deliberately by hand,
#   since they can need code changes (e.g. EF Core 9 requires .NET 9).
# Security vulnerabilities are still reported through Dependabot alerts.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]